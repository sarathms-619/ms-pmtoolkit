name = "pm-toolkit-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Comma-separated list of sites allowed to call the API (your Netlify site and portfolio).
ALLOWED_ORIGINS = "http://localhost:8080,https://YOUR-SITE.netlify.app,https://YOUR-PORTFOLIO-DOMAIN"

# Template files live here. Create with: npx wrangler r2 bucket create pm-toolkit-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "pm-toolkit-files"

# Download counter. Create with: npx wrangler d1 create pm-toolkit-db  (then paste the id below)
[[d1_databases]]
binding = "DB"
database_name = "pm-toolkit-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
