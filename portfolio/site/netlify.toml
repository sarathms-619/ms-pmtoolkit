# Publish this folder as-is (no build step).
[build]
  publish = "."

[[headers]]
  for = "/resume/*"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
